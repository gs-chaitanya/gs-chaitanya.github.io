{{ define "main" }}
<div style="padding: 2rem 0 4rem;">
  <h1 style="font-size: 2.25rem; font-weight: 800; color: var(--text-primary); margin-bottom: 0.5rem;">{{ .Title }}</h1>
  <div style="font-size: 1rem; color: var(--text-muted); margin-bottom: 2rem;">
    {{ .Content }}
  </div>
  <div class="projects-grid">
    {{ range .Pages }}
    <a href="{{ .RelPermalink }}" class="project-card">
      <h2 class="project-title">{{ .Title }}</h2>
      <p class="project-desc">{{ .Summary }}</p>
      <div class="project-footer">
        <span>Read more</span>
        <span class="project-arrow">→</span>
      </div>
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
